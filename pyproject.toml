[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-from-scratch"
version = "0.1.0"
description = "LoRA (Hu et al. 2021) implemented from scratch in PyTorch, with a real adaptation experiment on a tiny character-level GPT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
